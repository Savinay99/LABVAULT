{% extends "base.html" %}
{% load static %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" data-animate="fade-up" style="text-align: center;">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); display: inline-flex; align-items: center; justify-content: center; margin-bottom: var(--space-4);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <h1 class="auth-title">Password Reset Complete</h1>
    <p class="auth-subtitle" style="margin-bottom: var(--space-6);">
      Your password has been successfully updated. You may now sign in using your new credentials.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block btn-lg">
      Sign in to LabVault
    </a>
  </div>
</div>
{% endblock %}
