{% comment %}
  LabVault 3D Isometric Cryptographic Vault Emblem Logo
  Parameters (optional):
    size: 'sm' (28px), 'md' (34px, default), 'lg' (44px), 'xl' (54px)
    show_text: True/False (default: True)
    text_color_mode: 'light' / 'dark'
{% endcomment %}
<span class="brand-logo-3d" aria-hidden="true">
  <svg class="brand-logo-svg" width="{% if size == 'lg' %}44{% elif size == 'xl' %}54{% elif size == 'sm' %}26{% else %}34{% endif %}" height="{% if size == 'lg' %}44{% elif size == 'xl' %}54{% elif size == 'sm' %}26{% else %}34{% endif %}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Isometric Top Face Gradient -->
      <linearGradient id="lvLogoTop" x1="6" y1="4" x2="42" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
      </linearGradient>
      <!-- Isometric Left Face Gradient -->
      <linearGradient id="lvLogoLeft" x1="6" y1="14" x2="24" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#7C3AED"/>
        <stop offset="100%" stop-color="#4C1D95"/>
      </linearGradient>
      <!-- Isometric Right Face Gradient -->
      <linearGradient id="lvLogoRight" x1="24" y1="24" x2="42" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#EC4899"/>
        <stop offset="100%" stop-color="#F43F5E"/>
      </linearGradient>
      <!-- Ambient Core Glow -->
      <filter id="lvCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <!-- Isometric Cube Outer Faces -->
    <!-- Top Face (Crystalline Iris) -->
    <path d="M24 4.5L42 14.5L24 24.5L6 14.5L24 4.5Z" fill="url(#lvLogoTop)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Left Face (Deep Obsidian Purple) -->
    <path d="M6 14.5L24 24.5V43.5L6 33.5V14.5Z" fill="url(#lvLogoLeft)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right Face (Vibrant Neon Coral-Pink) -->
    <path d="M24 24.5L42 14.5V33.5L24 43.5V24.5Z" fill="url(#lvLogoRight)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Isometric Center Vault Lattice Geometry -->
    <path d="M24 10.5L33 15.5L24 20.5L15 15.5L24 10.5Z" fill="#FFFFFF" fill-opacity="0.25"/>
    <!-- Central Cryptographic Core Node -->
    <circle cx="24" cy="24.5" r="4.2" fill="#FFFFFF" filter="url(#lvCoreGlow)"/>
    <circle cx="24" cy="24.5" r="2.1" fill="#18181B"/>
    <!-- Precision Circuit & Seam Lines -->
    <line x1="24" y1="28.7" x2="24" y2="39.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="10" y1="21.5" x2="19.8" y2="26.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="38" y1="21.5" x2="28.2" y2="26.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
  </svg>
</span>
{% if show_text|default:True %}
<span class="brand-name">
  <span class="word-lab">Lab</span><span class="word-vault">Vault</span>
</span>
{% endif %}
