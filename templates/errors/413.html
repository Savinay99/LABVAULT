{% extends "base.html" %}

{% block title %}File too large{% endblock %}
{% block title_text %}File too large{% endblock %}

{% block content %}
<div class="error-page">
  <h1>413</h1>
  <p>{{ message|default:'The uploaded file exceeds the maximum allowed size.' }}</p>
  <a href="{% if user.is_authenticated %}{% url 'core:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
