{% extends "base.html" %}

{% block title %}Error{% endblock %}
{% block title_text %}Error{% endblock %}

{% block content %}
<div class="error-page">
  <h1>{{ code|default:'Error' }}</h1>
  <p>{{ message }}</p>
  <a href="{% if user.is_authenticated %}{% url 'core:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
