{% extends "base.html" %}

{% block title %}Not Found{% endblock %}
{% block title_text %}Not Found{% endblock %}

{% block content %}
<div class="error-page">
  <h1>404</h1>
  <p>{{ message|default:'The page you are looking for does not exist.' }}</p>
  <a href="{% if user.is_authenticated %}{% url 'core:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
