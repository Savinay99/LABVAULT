{% extends "base.html" %}

{% block title %}Server Error{% endblock %}
{% block title_text %}Server Error{% endblock %}

{% block content %}
<div class="error-page">
  <h1>500</h1>
  <p>{{ message|default:'An unexpected error occurred.' }}</p>
  <a href="{% if user.is_authenticated %}{% url 'core:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
