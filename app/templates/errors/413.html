{% extends "base.html" %}
{% block title %}File too large{% endblock %}

{% block content %}
<div class="error-page">
  <h1>413</h1>
  <p>{{ message or "The uploaded file exceeds the maximum allowed size." }}</p>
  <a href="{{ url_for('dashboard.index') if session.user_id else url_for('auth.login') }}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
