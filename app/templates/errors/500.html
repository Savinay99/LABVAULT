{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-page">
  <h1>500</h1>
  <p>{{ message }}</p>
  <a href="{{ url_for('dashboard.index') if session.user_id else url_for('auth.login') }}" class="btn btn-primary">Return</a>
</div>
{% endblock %}
